[project]
name = "pmem-bench"
version = "0.1.0"
description = "Personal LLM memory extraction benchmark — schema, judge, scoring, 35 hand-labeled examples"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brian Lo" }]
dependencies = [
    "anthropic>=0.92.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pmem-bench = "pmem_bench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmem_bench"]

[tool.hatch.build.targets.wheel.force-include]
"src/pmem_bench/data" = "pmem_bench/data"
